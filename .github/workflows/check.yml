name: Check

on:
  push:
    branches:
      - master
  pull_request:

# A new push to the same branch/PR supersedes the previous run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: Server & Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Unit tests
        working-directory: apps/server
        run: bun test test/

      - name: Build web
        run: bun run build:web

  rust:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dep + target cache (keyed on Cargo.lock + toolchain). The pinned
      # nightly from rust-toolchain.toml is auto-installed by rustup on the
      # first cargo call — inside the crate dir, via working-directory:
      # --manifest-path would bypass the CWD override and resolve stable.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent

      - name: Clippy
        working-directory: apps/agent
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: apps/agent
        run: cargo test
