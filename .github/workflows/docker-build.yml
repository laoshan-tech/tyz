name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # Pinned on purpose: the repo was renamed (tyz-node -> tyz) but the published
  # image keeps its established path so deployed nodes keep pulling updates.
  # github.repository would now resolve to the new name.
  IMAGE_NAME: laoshan-tech/tyz-node

jobs:
  build:
    # Skip on forks: IMAGE_NAME is pinned to this org, and a fork's
    # GITHUB_TOKEN cannot push to it (the run would only fail confusingly).
    if: github.repository_owner == 'laoshan-tech'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      # Version stamped into the embedded agent binary: the release tag on
      # releases, "nightly" on master pushes (rolling, no hash).
      - name: Compute agent version
        id: agentver
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=nightly" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TYZ_VERSION=${{ steps.agentver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
